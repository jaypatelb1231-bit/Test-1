<!DOCTYPE html>
<html>
<head>
    <title>Jay Patel</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }
        h1 { color: #00d4ff; font-size: 50px; }
        h2 { color: #ff6b6b; }
        p  { color: #aaaaaa; font-size: 18px; }
        .card {
            background-color: #16213e;
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            width: 400px;
        }
        input {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: none;
            width: 150px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #00d4ff;
            color: black;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }
        #result {
            font-size: 24px;
            color: #00d4ff;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Jay Patel</h1>
    <h2>⚙️ Mechanical Designer</h2>
    <p>📍 Vadodara, Gujarat, India</p>

    <div class="card">
        <h2>🔧 My Skills</h2>
        <p>✅ CAD Design</p>
        <p>✅ SolidWorks</p>
        <p>✅ AutoCAD</p>
        <p>✅ HTML & Git</p>
    </div>

    <div class="card">
        <h2>🧮 Gear Ratio Calculator</h2>
        <p>Driver Teeth:</p>
        <input type="number" id="driver" placeholder="Example: 20"/>
        <p>Driven Teeth:</p>
        <input type="number" id="driven" placeholder="Example: 60"/>
        <br/>
        <button onclick="calculate()">Calculate!</button>
        <div id="result"></div>
    </div>

    <div class="card">
        <h2>📞 Contact</h2>
        <p>📧 jaypatelb1231@gmail.com</p>
    </div>

    <script>
        function calculate() {
            var driver = document.getElementById("driver").value;
            var driven = document.getElementById("driven").value;
            if (driver == "" || driven == "") {
                document.getElementById("result").innerHTML = "⚠️ Please enter both values!";
                return;
            }
            var ratio = driven / driver;
            document.getElementById("result").innerHTML = 
                "⚙️ Gear Ratio = " + ratio.toFixed(2) + " : 1";
        }
    </script>

</body>
</html>
